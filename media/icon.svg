<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#052e2b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- 2x2 grid of project cards -->
  <g filter="url(#shadow)">
    <rect x="42" y="42" width="78" height="78" rx="14" fill="#ffffff"/>
    <rect x="136" y="42" width="78" height="78" rx="14" fill="#ffffff" opacity="0.92"/>
    <rect x="42" y="136" width="78" height="78" rx="14" fill="#ffffff" opacity="0.92"/>
    <rect x="136" y="136" width="78" height="78" rx="14" fill="#fbbf24"/>
  </g>

  <!-- card details -->
  <g fill="#0f766e">
    <rect x="56" y="58" width="36" height="9" rx="4.5"/>
  </g>
  <g stroke="#b6d4d0" stroke-width="7" stroke-linecap="round">
    <path d="M56 84 H104"/>
    <path d="M56 100 H88"/>
    <path d="M150 58 H198" stroke="#bfd0f5"/>
    <path d="M150 74 H182" stroke="#bfd0f5"/>
    <path d="M56 152 H104" stroke="#bfd0f5"/>
    <path d="M56 168 H88" stroke="#bfd0f5"/>
  </g>

  <!-- pinned star -->
  <path d="M175 152 l7.4 15 16.6 2.4 -12 11.7 2.8 16.5 -14.8 -7.8 -14.8 7.8 2.8 -16.5 -12 -11.7 16.6 -2.4z" fill="#ffffff"/>
</svg>
